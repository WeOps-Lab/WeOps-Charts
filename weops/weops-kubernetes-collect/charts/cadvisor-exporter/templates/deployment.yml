apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Chart.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}

  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
{{- with .Values.labels }}
{{ toYaml . | indent 8 }}
{{- end }}
      name: {{ .Chart.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

    spec:
      terminationGracePeriodSeconds: 60

      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent

          args:
            - "--housekeeping_interval=15s"
{{- if eq (default "docker" .Values.container_runtime) "docker" }}
            - "--docker_only=true"
            - "--docker=unix:///var/run/docker.sock"
{{- else if eq .Values.container_runtime "containerd" }}
            - "--docker_only=false"
            - "--containerd={{ .Values.containerd.socketPath }}"
{{- else }}
{{- fail "container_runtime must be either docker or containerd" }}
{{- end }}
            - "--disable_metrics=advtcp,app,cpu,cpuLoad,cpu_topology,cpuset,disk,diskIO,hugetlb,memory,memory_numa,network,oom_event,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp"
            - "--enable_metrics=cpu,cpuLoad,network,disk,diskIO,memory"

          resources:
            requests:
              cpu: 100m
              memory: 150Mi
            limits:
              cpu: 500m
              memory: 800Mi

          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true

            - name: sys
              mountPath: /sys
              readOnly: true

{{- if eq (default "docker" .Values.container_runtime) "docker" }}
            - name: docker-data
              mountPath: /var/lib/docker
              readOnly: true

            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
{{- else if eq .Values.container_runtime "containerd" }}
{{- if .Values.containerd.dataRoot.enabled }}
            - name: containerd-data
              mountPath: {{ .Values.containerd.dataRoot.mountPath }}
              readOnly: true
{{- end }}

            - name: containerd-run
              mountPath: {{ .Values.containerd.state.mountPath }}
              readOnly: true
{{- end }}

            - name: disk
              mountPath: /dev/disk
              readOnly: true

      volumes:
        - name: rootfs
          hostPath:
            path: /
            type: Directory

        - name: sys
          hostPath:
            path: /sys
            type: Directory

{{- if eq (default "docker" .Values.container_runtime) "docker" }}
        - name: docker-data
          hostPath:
            path: /var/lib/docker
            type: Directory

        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
{{- else if eq .Values.container_runtime "containerd" }}
{{- if .Values.containerd.dataRoot.enabled }}
        - name: containerd-data
          hostPath:
            path: {{ .Values.containerd.dataRoot.hostPath }}
{{- with .Values.containerd.dataRoot.hostPathType }}
            type: {{ . }}
{{- end }}
{{- end }}

        - name: containerd-run
          hostPath:
            path: {{ .Values.containerd.state.hostPath }}
{{- with .Values.containerd.state.hostPathType }}
            type: {{ . }}
{{- end }}
{{- end }}

        - name: disk
          hostPath:
            path: /dev/disk
            type: Directory              
