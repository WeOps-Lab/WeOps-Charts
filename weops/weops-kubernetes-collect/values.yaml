
# prometheus镜像
image:
  repository: docker.1panel.live/grafana/agent
  tag: main
  pullPolicy: IfNotPresent

# prometheus资源限制
resources:
  limits:
    cpu: 512m
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 32Mi

# remoteWrtie的目标地址，如
remoteWrtieUrl: http://admin:admin@10.10.10.10:9090/api/v1/write

# Alloy remote_write 发送队列配置。
# 默认 1 shard + 小容量队列，60s 采集洪峰（node-exporter + cAdvisor）会打满队列，
# 导致样本在采集器本机丢弃（表现为 node 指标曲线断点、up 正常）。
remoteWriteQueue:
  capacity: 50000
  minShards: 4
  maxShards: 50
  maxSamplesPerSend: 5000
  batchSendDeadline: "5s"
  maxBackoff: "5s"

# 想要使用其他kube-state-metrics时填写，仅在kubeStateMetrics.enable为false时生效
kubeStateMetricsUrl: ""

# k8s集群标签，用于区分多集群接入
kubeClusterLabel: a-kubernetes-cluster

# 数据刮削时间
scrape_interval: 60s
evaluation_interval: 60s

# 启用内置 kube-state-metrics
enableKubeStateMetrics: true
# kube-state-metrics 配置
kube-state-metrics:
  image:
    repository: k8s.m.daocloud.io/kube-state-metrics/kube-state-metrics
    tag: v2.5.0
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources: 
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  podAnnotations: 
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
    prometheus.io/scrape: "true"

node-exporter:
  labels:
    weops_version: "4.16-dev"

cadvisor-exporter:
  labels:
    weops_version: "4.16-dev"

kubeProxyPort: 10249
kubeApiServerPort: 6443
kubeletPort: 10250
kubeControllerManagerPort: 10257
kubeSchedulerPort: 10259
kubeEtcdPort: 2381
kubeDnsPort: 9153